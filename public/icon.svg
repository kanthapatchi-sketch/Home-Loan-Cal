<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2d59"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Main House Structure -->
  <g filter="url(#shadow)">
    <!-- Chimney -->
    <rect x="330" y="140" width="38" height="75" rx="6" fill="#cbd5e1"/>
    <rect x="324" y="132" width="50" height="14" rx="4" fill="#94a3b8"/>

    <!-- Roof -->
    <polygon points="256,105 92,238 126,270 256,165 386,270 420,238" fill="url(#roofGrad)"/>

    <!-- House Body -->
    <rect x="135" y="240" width="242" height="180" rx="16" fill="#f8fafc"/>

    <!-- Door (Modern rounded arch) -->
    <rect x="222" y="305" width="68" height="115" rx="10" fill="#0f2d59"/>
    <circle cx="274" cy="365" r="4.5" fill="#38bdf8"/>

    <!-- Left Window (Four-pane) -->
    <rect x="160" y="275" width="46" height="46" rx="8" fill="#e2e8f0"/>
    <rect x="163" y="278" width="18" height="18" rx="3" fill="#0284c7" fill-opacity="0.8"/>
    <rect x="185" y="278" width="18" height="18" rx="3" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="163" y="300" width="18" height="18" rx="3" fill="#38bdf8" fill-opacity="0.8"/>
    <rect x="185" y="300" width="18" height="18" rx="3" fill="#0284c7" fill-opacity="0.8"/>

    <!-- Right Window (Step Growth Chart / Smart Calculator Icon) -->
    <rect x="306" y="275" width="46" height="46" rx="8" fill="#e2e8f0"/>
    <rect x="312" y="303" width="8" height="13" rx="2" fill="#0284c7"/>
    <rect x="325" y="293" width="8" height="23" rx="2" fill="#0284c7"/>
    <rect x="338" y="283" width="8" height="33" rx="2" fill="#38bdf8"/>

    <!-- Smart Badge (Percentage / Savings emblem) -->
    <circle cx="256" cy="205" r="26" fill="url(#badgeGrad)"/>
    <text x="256" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">%</text>
  </g>
</svg>
